<div class="login-page">

  <!-- Background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <span>BV</span>
      </div>
      <h1 class="login-title">BankVision</h1>
      <p class="login-subtitle">Plataforma de Recuperación de Cartera</p>
    </div>

    <!-- Badge -->
    <div class="compliance-badge">
      <span class="badge-dot"></span>
      <span>Conforme Ley 2300 — Dejen de Fregar</span>
    </div>

    <!-- Form -->
    <form class="login-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            type="email"
            class="form-input has-icon"
            placeholder="admin@fintra.co"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            [type]="showPwd() ? 'text' : 'password'"
            class="form-input has-icon has-eye"
            placeholder="••••••••"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            autocomplete="current-password"
            required
          />
          <button type="button" class="eye-toggle" (click)="showPwd.update(v => !v)" [attr.aria-label]="showPwd() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (showPwd()) {
              <!-- ojo abierto -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <!-- ojo cerrado -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="alert alert-error">
          <span>⚠</span>
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Autenticando...
        } @else {
          <span>Iniciar Sesión</span>
          <span>→</span>
        }
      </button>
    </form>

    <!-- Hint -->
    <p class="login-hint">
      Admin: <strong>admin&#64;coovitel.co</strong> / <strong>Admin&#64;coovitel1!</strong>
    </p>
  </div>
</div>
