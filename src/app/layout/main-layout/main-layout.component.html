<div class="shell">

  <!-- ═══════════════ OVERLAY MÓVIL ═══════════════ -->
  @if (mobileOpen()) {
    <div class="sidebar-overlay" (click)="closeMobile()"></div>
  }

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar"
         [class.collapsed]="collapsed()"
         [class.mobile-open]="mobileOpen()">
    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-icon">BV</div>
      @if (!collapsed()) {
        <span class="logo-text">BankVision</span>
      }
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      @for (item of navItems; track item.id) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobile()"
          [title]="collapsed() ? item.label : ''"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Collapse Toggle (solo desktop) -->
    <button class="sidebar-toggle desktop-only" (click)="toggleSidebar()">
      {{ collapsed() ? '›' : '‹' }}
    </button>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="main-content">

    <!-- Header -->
    <header class="topbar">
      <div class="topbar-left">
        <!-- Hamburger (solo móvil) -->
        <button class="icon-btn mobile-menu-btn" (click)="toggleMobile()" title="Menú">
          <span class="hamburger-icon">
            <span></span><span></span><span></span>
          </span>
        </button>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Buscar asociado..." class="search-input" />
        </div>
      </div>

      <div class="topbar-right">
        <!-- Notification Bell -->
        <button class="icon-btn" title="Notificaciones">
          <span>🔔</span>
          <span class="notif-dot"></span>
        </button>

        <!-- User Info -->
        <div class="user-info">
          <div class="user-details">
            <span class="user-name">{{ session()?.username }}</span>
            <span class="user-role">{{ session()?.roles?.[0] }}</span>
          </div>
          <div class="avatar">{{ userInitials() }}</div>
        </div>

        <!-- Logout -->
        <button class="icon-btn logout-btn" (click)="logout()" title="Cerrar Sesión">
          ✕
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-content">
      <router-outlet />
    </div>

  </main>
</div>
